<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เพิ่มงานใหม่ 🐥</title>
    <link rel="stylesheet" href="styles.css">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

    <!-- Full Page Loader -->
    <div class="loader-overlay" id="global-loader">
        <img src="https://cdn-icons-png.flaticon.com/512/2663/2663067.png" alt="Chicku" class="mascot-img">
        <div class="loader-text">กำลังโหลด...</div>
    </div>

    <!-- Success Overlay -->
    <div class="overlay" id="success-overlay">
        <div class="popup-card">
            <img src="https://cdn-icons-png.flaticon.com/512/2663/2663067.png" width="80" class="mascot-img"><br><br>
            <h2 class="text-primary">✅ Chicku จดให้แล้ว!</h2>
            <p class="text-muted">กำลังพากลับหน้าหลัก...</p>
        </div>
    </div>

    <div class="container">
        <div class="mascot-container animate-fade-up">
            <img src="https://cdn-icons-png.flaticon.com/512/2663/2663067.png" alt="Chicku" class="mascot-img">
            <h2 class="text-primary mt-1">เพิ่มงานใหม่</h2>
            <p class="text-muted">บอก Chicku ว่ามีงานอะไร! 🐥</p>
        </div>

        <div class="card animate-fade-up delay-1">
            <form id="add-task-form">
                <div class="form-group">
                    <label class="form-label">📝 ชื่องาน</label>
                    <input type="text" id="title" class="form-control" placeholder="เช่น ส่งรายงาน, ทำการบ้าน..." required>
                </div>

                <div class="form-group">
                    <label class="form-label">📅 กำหนดส่ง</label>
                    <input type="datetime-local" id="deadline" class="form-control">
                </div>

                <div class="form-group">
                    <label class="form-label">ความด่วน</label>
                    <div class="priority-selector" id="priority-selector">
                        <button type="button" class="priority-btn" data-priority="urgent">🔴 ด่วนมาก</button>
                        <button type="button" class="priority-btn active" data-priority="normal">🟡 ปานกลาง</button>
                        <button type="button" class="priority-btn" data-priority="low">🟢 ปกติ</button>
                    </div>
                    <input type="hidden" id="priority" value="ปกติ">
                </div>

                <div class="form-group">
                    <label class="form-label">💬 หมายเหตุ (ถ้ามี)</label>
                    <textarea id="note" class="form-control" rows="3" placeholder="เพิ่มรายละเอียดเพิ่มเติม..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary mt-1">
                    🐥 ให้ Chicku จดให้!
                </button>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item" id="nav-dashboard">
            <span class="nav-icon">📊</span>
            Dashboard
        </a>
        <a href="add-task.html" class="nav-item active" id="nav-add">
            <span class="nav-icon">➕</span>
            เพิ่มงาน
        </a>
        <a href="schedule.html" class="nav-item" id="nav-schedule">
            <span class="nav-icon">📅</span>
            ตารางเรียน
        </a>
    </div>

    <script>
        let userId = '';
        let selectedPriority = 'ปกติ';

        async function initLiff() {
            try {
                await liff.init({ liffId: "2010087033-1VBJnBG1" }); 
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error('LIFF Error:', err);
                const urlParams = new URLSearchParams(window.location.search);
                userId = urlParams.get('userId') || localStorage.getItem('chicku_userId') || 'test_user_123';
            }

            if (userId) {
                localStorage.setItem('chicku_userId', userId);
                updateNavLinks();
            }
            document.getElementById('global-loader').classList.add('hide-loader');
        }

        function updateNavLinks() {
            document.getElementById('nav-dashboard').href = `index.html?userId=${userId}`;
            document.getElementById('nav-add').href = `add-task.html?userId=${userId}`;
            document.getElementById('nav-schedule').href = `schedule.html?userId=${userId}`;
        }

        // Priority Selector Logic
        document.querySelectorAll('.priority-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.priority-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const p = btn.getAttribute('data-priority');
                selectedPriority = p === 'urgent' ? 'ด่วนมาก' : (p === 'normal' ? 'ปกติ' : 'ต่ำ');
                document.getElementById('priority').value = selectedPriority;
            });
        });

        document.getElementById('add-task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!userId) return alert('ไม่พบข้อมูลผู้ใช้');

            const taskData = {
                title: document.getElementById('title').value,
                deadline: document.getElementById('deadline').value,
                priority: document.getElementById('priority').value,
                note: document.getElementById('note').value
            };

            try {
                const res = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, ...taskData })
                });

                if (res.ok) {
                    document.getElementById('success-overlay').style.display = 'flex';
                    setTimeout(() => {
                        if (liff.isInClient()) {
                            liff.closeWindow();
                        } else {
                            window.location.href = `index.html?userId=${userId}`;
                        }
                    }, 1500);
                } else {
                    alert('เกิดข้อผิดพลาด');
                }
            } catch (error) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
            }
        });

        initLiff();
    </script>
</body>
</html>
