<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Task</title>
    <link rel="stylesheet" href="styles.css">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

    <div class="loader-overlay" id="global-loader">
        <img src="chicku-mascot.png" alt="Chicku" class="mascot-img">
    </div>

    <!-- Minimal Success Overlay -->
    <div class="overlay" id="success-overlay">
        <div class="popup-card">
            <h2 class="title-xl">Task Saved</h2>
            <p class="subtitle">Chicku will remind you soon 🐥</p>
        </div>
    </div>

    <div class="container">
        <div class="mascot-container">
            <img src="chicku-mascot.png" alt="Chicku" class="mascot-img">
            <h1 class="title-xl">New Task</h1>
            <p class="subtitle">Tell Chicku what to remember</p>
        </div>

        <form id="add-task-form">
            <div class="form-group">
                <label class="form-label">Task Name</label>
                <input type="text" id="title" class="form-control" placeholder="e.g., Design Review" required>
            </div>

            <div class="form-group">
                <label class="form-label">Deadline</label>
                <input type="datetime-local" id="deadline" class="form-control">
            </div>

            <div class="form-group">
                <label class="form-label">Priority</label>
                <div class="priority-selector">
                    <div class="priority-option" data-priority="urgent">Urgent</div>
                    <div class="priority-option active" data-priority="normal">Normal</div>
                    <div class="priority-option" data-priority="low">Low</div>
                </div>
                <input type="hidden" id="priority" value="ปกติ">
            </div>

            <div class="form-group">
                <label class="form-label">Notes (Optional)</label>
                <textarea id="note" class="form-control" rows="2" style="resize: none;" placeholder="Details..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 40px;">
                Save Task
            </button>
        </form>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="nav-item" id="nav-dashboard">
            <span class="nav-icon">📊</span>
            Dashboard
        </a>
        <a href="add-task.html" class="nav-item active" id="nav-add">
            <span class="nav-icon">➕</span>
            Add
        </a>
        <a href="schedule.html" class="nav-item" id="nav-schedule">
            <span class="nav-icon">📅</span>
            Schedule
        </a>
    </div>

    <script>
        let userId = '';
        let selectedPriority = 'ปกติ';

        async function initLiff() {
            try {
                await liff.init({ liffId: "2010087033-1VBJnBG1" }); 
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error('LIFF Error:', err);
                const urlParams = new URLSearchParams(window.location.search);
                userId = urlParams.get('userId') || localStorage.getItem('chicku_userId') || 'test_user_123';
            }

            if (userId) {
                localStorage.setItem('chicku_userId', userId);
                updateNavLinks();
            }
            document.getElementById('global-loader').classList.add('hide-loader');
        }

        function updateNavLinks() {
            document.getElementById('nav-dashboard').href = `index.html?userId=${userId}`;
            document.getElementById('nav-add').href = `add-task.html?userId=${userId}`;
            document.getElementById('nav-schedule').href = `schedule.html?userId=${userId}`;
        }

        // Minimal Priority Selector
        document.querySelectorAll('.priority-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.priority-option').forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                
                const p = opt.getAttribute('data-priority');
                selectedPriority = p === 'urgent' ? 'ด่วนมาก' : (p === 'normal' ? 'ปกติ' : 'ต่ำ');
                document.getElementById('priority').value = selectedPriority;
            });
        });

        document.getElementById('add-task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!userId) return;

            const taskData = {
                title: document.getElementById('title').value,
                deadline: document.getElementById('deadline').value,
                priority: document.getElementById('priority').value,
                note: document.getElementById('note').value
            };

            try {
                const res = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, ...taskData })
                });

                if (res.ok) {
                    document.getElementById('success-overlay').style.display = 'flex';
                    setTimeout(() => {
                        if (liff.isInClient()) {
                            liff.closeWindow();
                        } else {
                            window.location.href = `index.html?userId=${userId}`;
                        }
                    }, 1500);
                }
            } catch (error) {}
        });

        initLiff();
    </script>
</body>
</html>
