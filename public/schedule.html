<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schedule</title>
    <link rel="stylesheet" href="styles.css">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        .class-row {
            padding: 24px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .class-time {
            font-size: 14px;
            font-weight: 700;
            width: 90px;
            color: var(--primary);
        }
        .class-details { flex: 1; }
        .class-subject { font-size: 17px; font-weight: 600; }
        .class-room { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: none; justify-content: center; align-items: center;
            z-index: 2000; padding: 24px;
        }
    </style>
</head>
<body>

    <div class="loader-overlay" id="global-loader">
        <img src="chicku-mascot.png" alt="Chicku" class="mascot-img">
    </div>

    <div class="container">
        <!-- Minimal Thai Header -->
        <div class="mascot-container">
            <h1 class="title-xl">ตารางเรียน</h1>
            <p class="subtitle">วันนี้มีเรียนอะไรบ้างคะ? 🐥</p>
        </div>

        <!-- Minimal Thai Countdown -->
        <div id="countdown-area" style="text-align: center; margin-bottom: 50px;">
            <p class="subtitle" style="text-transform: uppercase; letter-spacing: 1px;">วิชาถัดไป</p>
            <h2 id="next-subject" style="font-size: 24px; margin: 8px 0;">---</h2>
            <p id="cd-timer" style="font-size: 16px; font-weight: 600; color: var(--primary);">อีก -- ชม. -- น.</p>
        </div>

        <!-- Text-based Day Tabs (Thai) -->
        <div class="tabs" id="day-tabs">
            <div class="tab-item" onclick="changeDay(1)">จันทร์</div>
            <div class="tab-item" onclick="changeDay(2)">อังคาร</div>
            <div class="tab-item" onclick="changeDay(3)">พุธ</div>
            <div class="tab-item" onclick="changeDay(4)">พฤหัสบดี</div>
            <div class="tab-item" onclick="changeDay(5)">ศุกร์</div>
            <div class="tab-item" onclick="changeDay(6)">เสาร์</div>
            <div class="tab-item" onclick="changeDay(7)">อาทิตย์</div>
        </div>

        <div id="schedule-list">
            <!-- Items rendered here -->
        </div>

        <button class="btn btn-outline" style="margin-top: 40px;" onclick="openModal()">
            เพิ่มวิชาเรียน
        </button>
    </div>

    <!-- Modal Form - Full screen clean -->
    <div class="modal" id="addModal">
        <div style="width: 100%; max-width: 400px;">
            <h2 class="title-xl mb-2" style="text-align: center;">เพิ่มวิชาเรียนใหม่</h2>
            <form id="add-schedule-form">
                <div class="form-group">
                    <label class="form-label">วันเรียน</label>
                    <select id="day" class="form-control">
                        <option value="1">วันจันทร์</option>
                        <option value="2">วันอังคาร</option>
                        <option value="3">วันพุธ</option>
                        <option value="4">วันพฤหัสบดี</option>
                        <option value="5">วันศุกร์</option>
                        <option value="6">วันเสาร์</option>
                        <option value="7">วันอาทิตย์</option>
                    </select>
                </div>
                <div style="display: flex; gap: 20px;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">เวลาเริ่ม</label>
                        <input type="time" id="startTime" class="form-control" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">เวลาจบ</label>
                        <input type="time" id="endTime" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">ชื่อวิชา</label>
                    <input type="text" id="subject" class="form-control" placeholder="เช่น English 101" required>
                </div>
                <div class="form-group">
                    <label class="form-label">ห้องเรียน</label>
                    <input type="text" id="room" class="form-control" placeholder="เช่น Lab 401">
                </div>
                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary">บันทึกวิชาเรียน</button>
                    <button type="button" class="btn-ghost-danger" onclick="closeModal()">ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="nav-item" id="nav-dashboard">
            <span class="nav-icon">📊</span>
            Dashboard
        </a>
        <a href="add-task.html" class="nav-item" id="nav-add">
            <span class="nav-icon">➕</span>
            เพิ่มงาน
        </a>
        <a href="schedule.html" class="nav-item active" id="nav-schedule">
            <span class="nav-icon">📅</span>
            ตารางเรียน
        </a>
    </div>

    <script>
        let userId = '';
        let schedules = [];
        let viewDay = new Date().getDay() === 0 ? 7 : new Date().getDay();

        async function initLiff() {
            try {
                await liff.init({ liffId: "2010087033-1VBJnBG1" }); 
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error('LIFF Error:', err);
                const urlParams = new URLSearchParams(window.location.search);
                userId = urlParams.get('userId') || localStorage.getItem('chicku_userId') || 'test_user_123';
            }

            if (userId) {
                localStorage.setItem('chicku_userId', userId);
                updateNavLinks();
                fetchSchedule();
            }
            changeDay(viewDay);
        }

        function updateNavLinks() {
            document.getElementById('nav-dashboard').href = `index.html?userId=${userId}`;
            document.getElementById('nav-add').href = `add-task.html?userId=${userId}`;
            document.getElementById('nav-schedule').href = `schedule.html?userId=${userId}`;
        }

        async function fetchSchedule() {
            try {
                const res = await fetch(`/api/schedule?userId=${userId}`);
                schedules = await res.json();
                renderSchedule();
                updateCountdown();
            } catch (error) {}
            finally {
                document.getElementById('global-loader').classList.add('hide-loader');
            }
        }

        function changeDay(day) {
            viewDay = day;
            const tabs = document.querySelectorAll('.tab-item');
            tabs.forEach((t, i) => {
                if (i + 1 === day) t.classList.add('active');
                else t.classList.remove('active');
            });
            renderSchedule();
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-list');
            const daySchedules = schedules.filter(s => parseInt(s.day) === viewDay);
            daySchedules.sort((a,b) => a.startTime.localeCompare(b.startTime));

            if (daySchedules.length === 0) {
                container.innerHTML = `<p class="text-muted" style="text-align: center; padding: 60px;">🐥 วันนี้ไม่มีเรียนเลย พักผ่อนได้เต็มที่นะ!</p>`;
                return;
            }

            container.innerHTML = daySchedules.map(sch => {
                return `
                    <div class="class-row">
                        <div class="class-time">${sch.startTime}</div>
                        <div class="class-details">
                            <div class="class-subject">${sch.subject}</div>
                            <div class="class-room">📍 ${sch.room || "ไม่ได้ระบุห้อง"}</div>
                        </div>
                        <button onclick="deleteSchedule('${sch.id}')" style="border:none; background:none; font-size:14px; color:var(--danger);">✕</button>
                    </div>
                `;
            }).join('');
        }

        function updateCountdown() {
            const now = new Date();
            const today = now.getDay() === 0 ? 7 : now.getDay();
            const todaySchedules = schedules.filter(s => parseInt(s.day) === today);
            
            const nowStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            const nextClass = todaySchedules
                .filter(s => s.startTime > nowStr)
                .sort((a,b) => a.startTime.localeCompare(b.startTime))[0];

            if (!nextClass) {
                document.getElementById('next-subject').innerText = "หมดคาบเรียนวันนี้แล้วจ้า";
                document.getElementById('cd-timer').innerText = "🐥";
                return;
            }

            document.getElementById('next-subject').innerText = nextClass.subject;

            const [h, m] = nextClass.startTime.split(':').map(Number);
            const target = new Date();
            target.setHours(h, m, 0, 0);

            const diffMs = target - now;
            const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
            const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById('cd-timer').innerText = `อีก ${diffHrs} ชม. ${diffMins} น.`;
        }

        function openModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('addModal').style.display = 'none'; }

        async function deleteSchedule(id) {
            if(!confirm('ลบวิชานี้ใช่ไหมคะ?')) return;
            await fetch(`/api/schedule/${id}`, { method: 'DELETE' });
            fetchSchedule();
        }

        document.getElementById('add-schedule-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                day: document.getElementById('day').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                subject: document.getElementById('subject').value,
                room: document.getElementById('room').value,
                userId
            };

            await fetch('/api/schedule', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            closeModal();
            fetchSchedule();
        });

        // Hide Navbar when typing
        const navBar = document.querySelector('.nav-bar');
        const inputs = document.querySelectorAll('input, textarea, select');
        inputs.forEach(input => {
            input.addEventListener('focus', () => navBar.style.display = 'none');
            input.addEventListener('blur', () => navBar.style.display = 'flex');
        });

        setInterval(updateCountdown, 60000);
        initLiff();
    </script>
</body>
</html>
