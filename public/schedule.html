<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ตารางเรียน 🐥</title>
    <link rel="stylesheet" href="styles.css">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.5);
            padding: 5px;
            border-radius: 20px;
            margin-bottom: 20px;
            overflow-x: auto;
            gap: 5px;
        }
        .tab-item {
            flex: 1;
            padding: 10px 5px;
            text-align: center;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            min-width: 45px;
            transition: all 0.2s;
            color: var(--text-muted);
        }
        .tab-item.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 140, 0, 0.3);
        }
        .class-card {
            background: white;
            border-radius: 22px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
            border-left: 6px solid var(--primary);
            transition: all 0.3s;
        }
        .class-card.upcoming {
            background: #FFFBEB;
            border-color: var(--warning);
            transform: scale(1.02);
        }
        .class-time {
            font-size: 13px;
            font-weight: 800;
            color: var(--primary);
            width: 80px;
        }
        .class-info { flex: 1; }
        .class-subject { font-size: 16px; font-weight: 800; }
        .class-room { font-size: 12px; color: var(--text-muted); }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center;
            z-index: 2000; padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Full Page Loader -->
    <div class="loader-overlay" id="global-loader">
        <img src="chicku-mascot.png" alt="Chicku" class="mascot-img">
        <div class="loader-text">กำลังโหลด...</div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="mascot-container animate-fade-up">
            <h2 class="text-primary">📅 ตารางเรียน</h2>
            <p class="text-muted">วันนี้มีเรียนอะไรบ้าง? 🐥</p>
        </div>

        <!-- Next Class Countdown -->
        <div id="countdown-card" class="card animate-fade-up delay-1" style="background: linear-gradient(45deg, var(--primary), #FFA500); color: white; text-align: center;">
            <p style="font-size: 14px; opacity: 0.9; font-weight: 600;">🐥 คาบถัดไป: <span id="next-subject">---</span></p>
            <h1 id="cd-timer" style="font-size: 32px; margin: 10px 0;">-- ชม. -- น.</h1>
            <p id="next-room" style="font-size: 12px; opacity: 0.8;"></p>
        </div>

        <!-- Day Tabs -->
        <div class="tabs animate-fade-up delay-2" id="day-tabs">
            <div class="tab-item" onclick="changeDay(1)">จ</div>
            <div class="tab-item" onclick="changeDay(2)">อ</div>
            <div class="tab-item" onclick="changeDay(3)">พ</div>
            <div class="tab-item" onclick="changeDay(4)">พฤ</div>
            <div class="tab-item" onclick="changeDay(5)">ศ</div>
            <div class="tab-item" onclick="changeDay(6)">ส</div>
            <div class="tab-item" onclick="changeDay(7)">อา</div>
        </div>

        <!-- Schedule List -->
        <div id="schedule-list" class="animate-fade-up delay-3">
            <!-- Items rendered here -->
        </div>

        <button class="btn btn-primary mt-1 animate-fade-up delay-4" onclick="openModal()">
            ➕ เพิ่มวิชาเรียน
        </button>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="addModal">
        <div class="card" style="width: 100%; max-width: 400px;">
            <h3 class="mb-2">➕ เพิ่มวิชาเรียน</h3>
            <form id="add-schedule-form">
                <div class="form-group">
                    <label class="form-label">วันเรียน</label>
                    <select id="day" class="form-control">
                        <option value="1">วันจันทร์</option>
                        <option value="2">วันอังคาร</option>
                        <option value="3">วันพุธ</option>
                        <option value="4">วันพฤหัสบดี</option>
                        <option value="5">วันศุกร์</option>
                        <option value="6">วันเสาร์</option>
                        <option value="7">วันอาทิตย์</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">เวลาเริ่ม</label>
                        <input type="time" id="startTime" class="form-control" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">เวลาจบ</label>
                        <input type="time" id="endTime" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">ชื่อวิชา</label>
                    <input type="text" id="subject" class="form-control" placeholder="เช่น English 101" required>
                </div>
                <div class="form-group">
                    <label class="form-label">ห้องเรียน</label>
                    <input type="text" id="room" class="form-control" placeholder="เช่น Lab 401">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn" style="background: #EEE; flex: 1;" onclick="closeModal()">ยกเลิก</button>
                    <button type="submit" class="btn btn-primary" style="flex: 2;">🐥 บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item" id="nav-dashboard">
            <span class="nav-icon">📊</span>
            Dashboard
        </a>
        <a href="add-task.html" class="nav-item" id="nav-add">
            <span class="nav-icon">➕</span>
            เพิ่มงาน
        </a>
        <a href="schedule.html" class="nav-item active" id="nav-schedule">
            <span class="nav-icon">📅</span>
            ตารางเรียน
        </a>
    </div>

    <script>
        let userId = '';
        let schedules = [];
        let viewDay = new Date().getDay() === 0 ? 7 : new Date().getDay();

        async function initLiff() {
            try {
                await liff.init({ liffId: "2010087033-1VBJnBG1" }); 
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error('LIFF Error:', err);
                const urlParams = new URLSearchParams(window.location.search);
                userId = urlParams.get('userId') || localStorage.getItem('chicku_userId') || 'test_user_123';
            }

            if (userId) {
                localStorage.setItem('chicku_userId', userId);
                updateNavLinks();
                fetchSchedule();
            }
            changeDay(viewDay);
        }

        function updateNavLinks() {
            document.getElementById('nav-dashboard').href = `index.html?userId=${userId}`;
            document.getElementById('nav-add').href = `add-task.html?userId=${userId}`;
            document.getElementById('nav-schedule').href = `schedule.html?userId=${userId}`;
        }

        async function fetchSchedule() {
            try {
                const res = await fetch(`/api/schedule?userId=${userId}`);
                schedules = await res.json();
                renderSchedule();
                updateCountdown();
            } catch (error) {
                console.error(error);
            } finally {
                document.getElementById('global-loader').classList.add('hide-loader');
            }
        }

        function changeDay(day) {
            viewDay = day;
            const tabs = document.querySelectorAll('.tab-item');
            tabs.forEach((t, i) => {
                if (i + 1 === day) t.classList.add('active');
                else t.classList.remove('active');
            });
            renderSchedule();
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-list');
            const daySchedules = schedules.filter(s => parseInt(s.day) === viewDay);
            daySchedules.sort((a,b) => a.startTime.localeCompare(b.startTime));

            if (daySchedules.length === 0) {
                container.innerHTML = `
                    <div class="text-center card" style="padding: 40px; border: 2px dashed #FFDAB9; background: transparent;">
                        <p style="color: var(--text-muted); font-weight: 600;">🐥 ไม่มีเรียนวันนี้ พักได้!</p>
                    </div>`;
                return;
            }

            const now = new Date();
            const nowStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

            container.innerHTML = daySchedules.map(sch => {
                const isUpcoming = viewDay === (new Date().getDay() === 0 ? 7 : new Date().getDay()) && sch.startTime > nowStr;
                return `
                    <div class="class-card ${isUpcoming ? 'upcoming' : ''}">
                        <div class="class-time">${sch.startTime} - ${sch.endTime}</div>
                        <div class="class-info">
                            <div class="class-subject">${sch.subject}</div>
                            <div class="class-room">📍 ${sch.room || "ไม่ระบุห้อง"}</div>
                        </div>
                        <button onclick="deleteSchedule('${sch.id}')" style="border:none; background:none; font-size:16px;">🗑️</button>
                    </div>
                `;
            }).join('');
        }

        function updateCountdown() {
            const now = new Date();
            const today = now.getDay() === 0 ? 7 : now.getDay();
            const todaySchedules = schedules.filter(s => parseInt(s.day) === today);
            
            const nowStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            const nextClass = todaySchedules
                .filter(s => s.startTime > nowStr)
                .sort((a,b) => a.startTime.localeCompare(b.startTime))[0];

            if (!nextClass) {
                document.getElementById('next-subject').innerText = "หมดคาบแล้ววันนี้!";
                document.getElementById('cd-timer').innerText = "🐥";
                document.getElementById('next-room').innerText = "พักผ่อนเยอะๆ นะคะ";
                return;
            }

            document.getElementById('next-subject').innerText = nextClass.subject;
            document.getElementById('next-room').innerText = `📍 ${nextClass.room || "ไม่ระบุห้อง"}`;

            const [h, m] = nextClass.startTime.split(':').map(Number);
            const target = new Date();
            target.setHours(h, m, 0, 0);

            const diffMs = target - now;
            const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
            const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById('cd-timer').innerText = `${diffHrs} ชม. ${diffMins} น.`;
        }

        function openModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('addModal').style.display = 'none'; }

        async function deleteSchedule(id) {
            if(!confirm('ต้องการลบวิชานี้ใช่ไหม?')) return;
            await fetch(`/api/schedule/${id}`, { method: 'DELETE' });
            fetchSchedule();
        }

        document.getElementById('add-schedule-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                day: document.getElementById('day').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                subject: document.getElementById('subject').value,
                room: document.getElementById('room').value,
                userId
            };

            await fetch('/api/schedule', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            closeModal();
            fetchSchedule();
        });

        setInterval(updateCountdown, 60000);
        initLiff();
    </script>
</body>
</html>
