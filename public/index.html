<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicku Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

    <div class="loader-overlay" id="global-loader">
        <img src="chicku-mascot.png" alt="Chicku" class="mascot-img">
        <div class="loader-text">กำลังเปิดหน้ากระดานงาน...</div>
    </div>

    <div class="container">
        <!-- Minimal Header -->
        <div class="mascot-container">
            <img src="chicku-mascot.png" alt="Chicku" class="mascot-img">
            <h1 class="title-xl">Chicku Dashboard</h1>
            <p id="today-date" class="subtitle"></p>
        </div>

        <!-- Summary with Thai labels & Color -->
        <div class="summary-container">
            <div class="summary-item">
                <span class="value" id="count-total">0</span>
                <span class="label">งานทั้งหมด</span>
            </div>
            <div class="summary-item">
                <span class="value" id="count-urgent" style="color: var(--danger);">0</span>
                <span class="label">งานด่วน</span>
            </div>
            <div class="summary-item">
                <span class="value" id="count-done" style="color: var(--success);">0</span>
                <span class="label">เสร็จแล้ว</span>
            </div>
        </div>

        <!-- Minimalist Thai List -->
        <div style="margin-top: 40px;">
            <h2 style="font-size: 18px; margin-bottom: 10px; font-weight: 600;">รายการงานที่ค้างอยู่</h2>
            <div id="task-list">
                <p class="text-muted" style="text-align: center; padding: 40px;">กำลังรวบรวมงานให้คุณ...</p>
            </div>
        </div>
    </div>

    <!-- Ultra Minimal Nav -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item active" id="nav-dashboard">
            <span class="nav-icon">📊</span>
            Dashboard
        </a>
        <a href="add-task.html" class="nav-item" id="nav-add">
            <span class="nav-icon">➕</span>
            เพิ่มงาน
        </a>
        <a href="schedule.html" class="nav-item" id="nav-schedule">
            <span class="nav-icon">📅</span>
            ตารางเรียน
        </a>
    </div>

    <script>
        let userId = '';

        async function initLiff() {
            try {
                await liff.init({ liffId: "2010087033-1VBJnBG1" }); 
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error('LIFF Error:', err);
                const urlParams = new URLSearchParams(window.location.search);
                userId = urlParams.get('userId') || localStorage.getItem('chicku_userId') || 'test_user_123';
            }

            if (userId) {
                localStorage.setItem('chicku_userId', userId);
                updateNavLinks();
                fetchTasks();
            }
            displayDate();
        }

        function displayDate() {
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            const today = new Date().toLocaleDateString('th-TH', options);
            document.getElementById('today-date').innerText = today;
        }

        function updateNavLinks() {
            document.getElementById('nav-dashboard').href = `index.html?userId=${userId}`;
            document.getElementById('nav-add').href = `add-task.html?userId=${userId}`;
            document.getElementById('nav-schedule').href = `schedule.html?userId=${userId}`;
        }

        async function fetchTasks() {
            try {
                const res = await fetch(`/api/tasks?userId=${userId}`);
                const tasks = await res.json();
                renderTasks(tasks);
                updateSummary(tasks);
            } catch (error) {
                console.error('Error fetching tasks:', error);
            } finally {
                document.getElementById('global-loader').classList.add('hide-loader');
            }
        }

        function updateSummary(tasks) {
            document.getElementById('count-total').innerText = tasks.length;
            document.getElementById('count-urgent').innerText = tasks.filter(t => t.priority === 'ด่วนมาก' || t.priority === 'urgent').length;
            const doneCount = localStorage.getItem(`done_count_${userId}`) || 0;
            document.getElementById('count-done').innerText = doneCount;
        }

        function renderTasks(tasks) {
            const container = document.getElementById('task-list');
            if (tasks.length === 0) {
                container.innerHTML = `<p class="text-muted" style="text-align: center; padding: 60px;">🐥 ไม่มีงานค้างเลย พักผ่อนได้เต็มที่นะ!</p>`;
                return;
            }

            container.innerHTML = tasks.map((task) => {
                const title = task.title || "ไม่ได้ระบุชื่องาน";
                const deadlineStr = task.deadline && task.deadline !== "ไม่ระบุ" 
                    ? new Date(task.deadline).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
                    : "ไม่ได้กำหนดเวลา";
                
                const dotClass = task.priority === 'ด่วนมาก' || task.priority === 'urgent' ? 'dot-urgent' : 
                                (task.priority === 'ปกติ' || task.priority === 'normal' ? 'dot-normal' : 'dot-low');

                return `
                    <div class="task-item" id="task-${task.id}">
                        <div class="task-title">${title}</div>
                        <div class="task-meta">
                            <span class="priority-dot ${dotClass}"></span>
                            <span>${deadlineStr}</span>
                        </div>
                        <div style="display: flex; gap: 20px; margin-top: 5px;">
                            <button class="btn-ghost-success" onclick="completeTask('${task.id}')">เสร็จงาน</button>
                            <button class="btn-ghost-danger" onclick="deleteTask('${task.id}')">ลบทิ้ง</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function completeTask(id) {
            try {
                const res = await fetch(`/api/tasks/${id}/done`, { method: 'POST' });
                if (res.ok) {
                    const el = document.getElementById(`task-${id}`);
                    el.style.opacity = '0';
                    el.style.transform = 'translateY(-10px)';
                    setTimeout(() => {
                        el.remove();
                        let doneCount = parseInt(localStorage.getItem(`done_count_${userId}`) || 0);
                        localStorage.setItem(`done_count_${userId}`, doneCount + 1);
                        document.getElementById('count-done').innerText = doneCount + 1;
                    }, 300);
                }
            } catch (err) {}
        }

        async function deleteTask(id) {
            try {
                const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    const el = document.getElementById(`task-${id}`);
                    el.style.opacity = '0';
                    setTimeout(() => el.remove(), 300);
                }
            } catch (err) {}
        }

        initLiff();
    </script>
</body>
</html>
