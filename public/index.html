<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicku Dashboard 🐥</title>
    <link rel="stylesheet" href="styles.css">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

    <!-- Full Page Loader -->
    <div class="loader-overlay" id="global-loader">
        <img src="chicku-mascot.png" alt="Chicku" class="mascot-img">
        <div class="loader-text">กำลังโหลด...</div>
    </div>

    <div class="container">
        <!-- Header Section -->
        <div class="mascot-container animate-fade-up">
            <img src="chicku-mascot.png" alt="Chicku" class="mascot-img">
            <h2 class="text-primary mt-1">Chicku Dashboard 🐥</h2>
            <p id="today-date" style="font-size: 14px; color: var(--text-muted); font-weight: 600;"></p>
        </div>

        <!-- Summary Cards -->
        <div class="summary-container animate-fade-up delay-1">
            <div class="summary-item summary-total">
                <span class="icon">📋</span>
                <span class="value" id="count-total">0</span>
                <span class="label">งานทั้งหมด</span>
            </div>
            <div class="summary-item summary-urgent">
                <span class="icon">🚨</span>
                <span class="value" id="count-urgent">0</span>
                <span class="label">งานด่วน</span>
            </div>
            <div class="summary-item summary-done">
                <span class="icon">✅</span>
                <span class="value" id="count-done">0</span>
                <span class="label">เสร็จแล้ว</span>
            </div>
        </div>

        <!-- Task List Section -->
        <div class="animate-fade-up delay-2">
            <h3 class="mb-2">รายการงานของคุณ 📋</h3>
            <div id="task-list">
                <!-- Tasks will be rendered here -->
                <div class="text-center text-muted card" style="padding: 40px;">
                    <img src="chicku-mascot.png" width="60" class="mascot-img" style="opacity: 0.8"><br><br>
                    กำลังพาเพื่อนมา...
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item active" id="nav-dashboard">
            <span class="nav-icon">📊</span>
            Dashboard
        </a>
        <a href="add-task.html" class="nav-item" id="nav-add">
            <span class="nav-icon">➕</span>
            เพิ่มงาน
        </a>
        <a href="schedule.html" class="nav-item" id="nav-schedule">
            <span class="nav-icon">📅</span>
            ตารางเรียน
        </a>
    </div>

    <script>
        let userId = '';

        async function initLiff() {
            try {
                await liff.init({ liffId: "2010087033-1VBJnBG1" }); 
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error('LIFF Error:', err);
                const urlParams = new URLSearchParams(window.location.search);
                userId = urlParams.get('userId') || localStorage.getItem('chicku_userId') || 'test_user_123';
            }

            if (userId) {
                localStorage.setItem('chicku_userId', userId);
                updateNavLinks();
                fetchTasks();
            }
            displayDate();
        }

        function displayDate() {
            const options = { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' };
            const today = new Date().toLocaleDateString('th-TH', options);
            document.getElementById('today-date').innerText = today;
        }

        function updateNavLinks() {
            document.getElementById('nav-dashboard').href = `index.html?userId=${userId}`;
            document.getElementById('nav-add').href = `add-task.html?userId=${userId}`;
            document.getElementById('nav-schedule').href = `schedule.html?userId=${userId}`;
        }

        async function fetchTasks() {
            try {
                const res = await fetch(`/api/tasks?userId=${userId}`);
                const tasks = await res.json();
                renderTasks(tasks);
                updateSummary(tasks);
            } catch (error) {
                console.error('Error fetching tasks:', error);
                document.getElementById('task-list').innerHTML = `
                    <div class="card text-center">
                        <p>เกิดข้อผิดพลาดในการโหลดข้อมูล 🐥</p>
                    </div>`;
            } finally {
                document.getElementById('global-loader').classList.add('hide-loader');
            }
        }

        function updateSummary(tasks) {
            const total = tasks.length;
            const urgent = tasks.filter(t => t.priority === 'ด่วนมาก' || t.priority === 'urgent').length;
            // Note: Since API only returns not-done tasks, we might want to fetch stats differently 
            // but for now we'll show active counts.
            document.getElementById('count-total').innerText = total;
            document.getElementById('count-urgent').innerText = urgent;
            // Let's assume 'done' is a cumulative stat or just placeholders for now
            // We'll use local storage or just keep it 0 if not tracked.
            const doneCount = localStorage.getItem(`done_count_${userId}`) || 0;
            document.getElementById('count-done').innerText = doneCount;
        }

        function renderTasks(tasks) {
            const container = document.getElementById('task-list');
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="text-center card" style="padding: 40px; border: 2px dashed #FFDAB9; background: transparent;">
                        <img src="chicku-mascot.png" width="60" style="opacity: 0.5; filter: grayscale(100%);"><br><br>
                        <p style="color: var(--text-muted); font-weight: 600;">🐥 ไม่มีงานค้างเลย เก่งมาก!</p>
                    </div>`;
                return;
            }

            container.innerHTML = tasks.map((task, index) => {
                const title = task.title || "ไม่ระบุชื่องาน";
                const deadlineStr = task.deadline && task.deadline !== "ไม่ระบุ" 
                    ? new Date(task.deadline).toLocaleString('th-TH', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
                    : "ไม่ระบุเวลา";
                
                const priorityClass = task.priority === 'ด่วนมาก' || task.priority === 'urgent' ? 'badge-urgent' : 
                                     (task.priority === 'ปกติ' || task.priority === 'normal' ? 'badge-normal' : 'badge-low');
                const priorityEmoji = task.priority === 'ด่วนมาก' || task.priority === 'urgent' ? '🔴' : 
                                      (task.priority === 'ปกติ' || task.priority === 'normal' ? '🟡' : '🟢');
                const priorityLabel = task.priority === 'ด่วนมาก' || task.priority === 'urgent' ? 'ด่วนมาก' : 
                                      (task.priority === 'ปกติ' || task.priority === 'normal' ? 'ปานกลาง' : 'ปกติ');

                return `
                    <div class="task-item animate-fade-up" style="animation-delay: ${index * 0.1}s" id="task-${task.id}">
                        <div class="task-content">
                            <div class="task-title">${title}</div>
                            <div class="task-meta">
                                <span class="badge ${priorityClass}">${priorityEmoji} ${priorityLabel}</span>
                                <span>📅 ${deadlineStr}</span>
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="btn-action btn-success" onclick="completeTask('${task.id}', '${task.title}')">✅ เสร็จแล้ว</button>
                            <button class="btn-action btn-danger" style="flex: 0.4;" onclick="deleteTask('${task.id}')">🗑️ ลบ</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function completeTask(id, title) {
            if (!confirm('เสร็จงานนี้แล้วใช่ไหมคะ? 🐥')) return;
            
            try {
                const res = await fetch(`/api/tasks/${id}/done`, { method: 'POST' });
                if (res.ok) {
                    const el = document.getElementById(`task-${id}`);
                    el.style.transition = 'all 0.5s';
                    el.style.opacity = '0';
                    el.style.transform = 'translateX(100px)';
                    
                    // Increment local done count for UI
                    let doneCount = parseInt(localStorage.getItem(`done_count_${userId}`) || 0);
                    localStorage.setItem(`done_count_${userId}`, doneCount + 1);
                    document.getElementById('count-done').innerText = doneCount + 1;

                    setTimeout(() => el.remove(), 500);
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาด');
            }
        }

        async function deleteTask(id) {
            if (!confirm('ต้องการลบงานนี้ใช่ไหมคะ? 🐥')) return;
            
            try {
                const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    const el = document.getElementById(`task-${id}`);
                    el.style.transition = 'all 0.5s';
                    el.style.opacity = '0';
                    el.style.transform = 'scale(0.8)';
                    setTimeout(() => el.remove(), 500);
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาด');
            }
        }

        initLiff();
    </script>
</body>
</html>
