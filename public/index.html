<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicku Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .stat-card .num {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        .stat-card .label {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .task-list {
            margin-top: 20px;
        }
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .task-info h4 {
            margin-bottom: 4px;
        }
        .task-info .meta {
            font-size: 12px;
            color: var(--text-muted);
        }
        .task-actions {
            display: flex;
            gap: 8px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state img {
            width: 80px;
            opacity: 0.5;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="mascot-header">
            <img src="https://cdn-icons-png.flaticon.com/512/2663/2663067.png" alt="Chicku">
            <h2 class="text-primary">Chicku Dashboard</h2>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="num" id="stat-total">0</div>
                <div class="label">งานทั้งหมด</div>
            </div>
            <div class="stat-card">
                <div class="num text-danger" id="stat-urgent">0</div>
                <div class="label">ด่วนมาก</div>
            </div>
            <div class="stat-card">
                <div class="num text-success" id="stat-done">0</div>
                <div class="label">เสร็จแล้ว</div>
            </div>
        </div>

        <h3>รายการงานของคุณ 📋</h3>
        <div class="task-list" id="task-list">
            <div class="empty-state">
                <img src="https://cdn-icons-png.flaticon.com/512/2663/2663067.png" alt="Chicku">
                <p>กำลังโหลดข้อมูล...</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item active" id="nav-dashboard">
            <span class="nav-icon">📊</span>
            Dashboard
        </a>
        <a href="add-task.html" class="nav-item" id="nav-add">
            <span class="nav-icon">➕</span>
            เพิ่มงาน
        </a>
        <a href="schedule.html" class="nav-item" id="nav-schedule">
            <span class="nav-icon">📅</span>
            ตารางเรียน
        </a>
    </div>

    <script>
        let userId = '';
        
        async function initLiff() {
            try {
                // เปลี่ยน YOUR_LIFF_ID เป็น LIFF ID จริงจาก LINE Developers
                await liff.init({ liffId: "YOUR_LIFF_ID" }); 
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error('LIFF Error:', err);
                // Fallback for testing
                const urlParams = new URLSearchParams(window.location.search);
                userId = urlParams.get('userId') || localStorage.getItem('chicku_userId') || 'test_user_123';
            }

            if (userId) {
                localStorage.setItem('chicku_userId', userId);
                updateNavLinks();
                fetchTasks();
            }
        }

        function updateNavLinks() {
            document.getElementById('nav-dashboard').href = `index.html?userId=${userId}`;
            document.getElementById('nav-add').href = `add-task.html?userId=${userId}`;
            document.getElementById('nav-schedule').href = `schedule.html?userId=${userId}`;
        }

        async function fetchTasks() {
            try {
                const res = await fetch(`/api/tasks?userId=${userId}`);
                const tasks = await res.json();
                renderTasks(tasks);
            } catch (error) {
                console.error('Error fetching tasks:', error);
                document.getElementById('task-list').innerHTML = `
                    <div class="empty-state">
                        <p>เกิดข้อผิดพลาดในการโหลดข้อมูล</p>
                    </div>`;
            }
        }

        function getBadgeClass(priority) {
            if (priority === 'high' || priority === '🔴 ด่วนมาก') return 'badge-high';
            if (priority === 'medium' || priority === '🟡 ปานกลาง') return 'badge-medium';
            return 'badge-low';
        }

        function renderTasks(tasks) {
            const taskList = document.getElementById('task-list');
            
            document.getElementById('stat-total').textContent = tasks.length;
            document.getElementById('stat-urgent').textContent = tasks.filter(t => t.priority === 'high' || t.priority === '🔴 ด่วนมาก').length;
            document.getElementById('stat-done').textContent = '0';

            if (tasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <img src="https://cdn-icons-png.flaticon.com/512/2663/2663067.png" alt="Chicku">
                        <p>ไม่มีงานค้างนะ เก่งมาก! 🎉</p>
                    </div>`;
                return;
            }

            let html = '';
            tasks.forEach(task => {
                html += `
                    <div class="card task-item" id="task-${task.id}">
                        <div class="task-info">
                            <h4>${task.title}</h4>
                            <div class="meta">
                                <span class="badge ${getBadgeClass(task.priority)}">${task.priority || 'ปกติ'}</span>
                                <span style="margin-left:8px;">🕒 ${task.deadline || 'ไม่ระบุ'}</span>
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="btn btn-sm btn-success" onclick="markDone('${task.id}')">✓</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteTask('${task.id}')">✗</button>
                        </div>
                    </div>
                `;
            });
            taskList.innerHTML = html;
        }

        async function markDone(id) {
            if(!confirm('ทำเครื่องหมายว่าเสร็จแล้ว?')) return;
            try {
                await fetch(`/api/tasks/${id}/done`, { method: 'PUT' });
                document.getElementById(`task-${id}`).style.opacity = '0.5';
                setTimeout(() => fetchTasks(), 500);
            } catch (e) {
                alert('เกิดข้อผิดพลาด');
            }
        }

        async function deleteTask(id) {
            if(!confirm('ต้องการลบงานนี้ใช่ไหม?')) return;
            try {
                await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                document.getElementById(`task-${id}`).remove();
                fetchTasks();
            } catch (e) {
                alert('เกิดข้อผิดพลาด');
            }
        }

        initLiff();
    </script>
</body>
</html>
